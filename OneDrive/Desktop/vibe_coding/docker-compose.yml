services:
  postgres:
    image: postgres:16-alpine
    container_name: task_management_postgres
    environment:
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    volumes:
      - task_management_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  task_management_data:
